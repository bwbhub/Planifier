name: CI

on:
  pull_request:
  push:
    branches: [master]

# Une seule exécution par branche : une nouvelle poussée annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Lecture seule : la CI n'écrit rien dans le dépôt.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Base vide, locale au job, dédiée aux tests (`_test`) : migrations, seed, puis tests d'intégration qui la vident.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: planifier
          POSTGRES_PASSWORD: planifier
          POSTGRES_DB: planifier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planifier -d planifier_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://planifier:planifier@localhost:5432/planifier_test
      DATABASE_URL_UNPOOLED: postgresql://planifier:planifier@localhost:5432/planifier_test

    # Actions épinglées par SHA (chaîne d'approvisionnement) ; le tag est en commentaire.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Version de pnpm lue dans `packageManager` (package.json).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check
      - name: Types
        run: pnpm check-types
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

      # Migrations sur base vide, puis preuve qu'elles produisent exactement le schéma (aucune dérive), puis seed.
      - name: Migrations
        run: pnpm --filter @planifier/db migrate:deploy
      - name: Dérive schéma / migrations
        run: pnpm --filter @planifier/db exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Seed
        run: pnpm --filter @planifier/db seed
      # Tests sur la base migrée (inscription, connexion, session) : après les migrations, pas avant.
      - name: Tests d'intégration
        run: pnpm test:integration

  # Parcours de bout en bout (web construit + API), Chromium seul (docs/DEPENDANCES.md). Job à part : son temps et
  # ses échecs ne se mêlent pas à ceux de `verify`.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: planifier
          POSTGRES_PASSWORD: planifier
          POSTGRES_DB: planifier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planifier -d planifier_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Boîte de réception des e-mails de l'API (vérification d'adresse, mot de passe oublié), lue par les parcours.
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports:
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://planifier:planifier@localhost:5432/planifier_test
      DATABASE_URL_UNPOOLED: postgresql://planifier:planifier@localhost:5432/planifier_test
      MAILPIT_URL: http://localhost:8025

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Migrations
        run: pnpm --filter @planifier/db migrate:deploy
      - name: Navigateur
        run: pnpm --filter @planifier/web exec playwright install --with-deps chromium
      # Construit le web (dépendance turbo `build`) puis lance les parcours.
      - name: Tests E2E
        run: pnpm test:e2e
