# Services locaux pour le développement (jamais utilisés en production) : PostgreSQL et Mailpit.
# Démarrer : `docker compose up -d` ; arrêter : `docker compose down` (ajouter `-v` pour effacer les données).
services:
  postgres:
    image: postgres:17-alpine
    ports:
      # Écoute sur la boucle locale uniquement : identifiants de dev connus, jamais exposés au réseau.
      # 5433 côté hôte pour ne pas entrer en conflit avec un PostgreSQL local.
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: planifier
      POSTGRES_PASSWORD: planifier
      POSTGRES_DB: planifier
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planifier -d planifier"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Boîte de réception locale : les e-mails de l'API (MAIL_TRANSPORT=mailpit) arrivent ici, rien ne sort.
  # Interface et API HTTP : http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
