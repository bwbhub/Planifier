# PostgreSQL local pour le développement (jamais utilisé en production).
# Démarrer : `docker compose up -d` ; arrêter : `docker compose down` (ajouter `-v` pour effacer les données).
services:
  postgres:
    image: postgres:17-alpine
    ports:
      # Écoute sur la boucle locale uniquement : identifiants de dev connus, jamais exposés au réseau.
      # 5433 côté hôte pour ne pas entrer en conflit avec un PostgreSQL local.
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: planifier
      POSTGRES_PASSWORD: planifier
      POSTGRES_DB: planifier
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planifier -d planifier"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
